<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mizune — AI Companion</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Draggable title bar (for frameless window) -->
    <div id="title-bar" data-tauri-drag-region>
        <div class="title-left" data-tauri-drag-region>
            <div class="blob-icon-micro" data-tauri-drag-region></div>
            <span id="title-text" data-tauri-drag-region>Mizune</span>
        </div>
        <div id="title-controls">
            <button type="button" id="btn-minimize" title="Minimize">─</button>
            <button type="button" id="btn-close" title="Close">✕</button>
        </div>
    </div>

    <!-- Main Layout Container -->
    <div id="app-layout">
        
        <!-- Fixed Sidebar (Kimi Style) -->
        <aside id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <div class="blob-icon-small">
                        <div class="eye"></div><div class="eye"></div>
                    </div>
                    <span>Mizune</span>
                </div>
                <button id="btn-new-chat" class="new-chat-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                    <span class="shortcut">Ctrl K</span>
                </button>
                
                <nav class="sidebar-nav">
                    <a href="#" class="nav-item"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg> Documents</a>
                    <a href="#" class="nav-item"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg> Web Search</a>
                    <a href="#" class="nav-item"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Code Sandbox</a>
                    <a href="#" class="nav-item" id="btn-settings-toggle"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Settings</a>
                </nav>

                <div class="chat-history-list">
                    <div class="history-label">Chat History</div>
                    <div class="history-item active">Master Rushi Sync</div>
                    <div class="history-item">UI Redesign Plan</div>
                    <div class="history-item">Project Apollo</div>
                </div>
            </div>
            
            <div class="sidebar-bottom">
                <button id="btn-toggle-vrm" class="user-profile-btn">
                    <div class="avatar-placeholder">V</div>
                    <div class="profile-text">
                        <span class="name">VRM Avatar</span>
                        <span class="status">Disabled</span>
                    </div>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main id="chat-container">
            <!-- Top Header -->
            <header class="chat-header">
                <h2>Mizune AI</h2>
                <div class="header-actions">
                    <!-- Sandbox Toggle Button -->
                    <button id="btn-toggle-sandbox" class="sandbox-toggle-btn" title="Toggle Sandbox">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        <span class="status-dot"></span>
                    </button>
                </div>
            </header>

            <!-- Center Interactive Blob Avatar -->
            <div id="blob-container">
                <div id="mizune-blob" class="blob">
                    <div class="blob-eye left"></div>
                    <div class="blob-eye right"></div>
                </div>
                <div class="blob-glow"></div>
            </div>

            <!-- Chat History Area -->
            <div id="main-chat-history" class="scroll-area">
                <!-- Messages will be injected here -->
                <div class="chat-message mizune-msg welcome-msg">
                    <div class="msg-avatar">
                        <div class="blob-icon-small"><div class="eye"></div><div class="eye"></div></div>
                    </div>
                    <div class="msg-content">
                        <p>Hey! How can I help you today?</p>
                        <div class="msg-actions">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Pill Area -->
            <div class="input-container-wrapper">
                <div class="input-pill">
                    <button class="pill-btn add-attachment" title="Add Attachment">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    
                    <input id="chat-input" type="text" placeholder="Ask away. Pics work too." autocomplete="off" />
                    
                    <div class="pill-controls">
                        <select id="skill-selector" class="model-select">
                            <option value="auto">Mizune Core ▾</option>
                            <option value="autonomous_sales">Sales Agent ▾</option>
                        </select>
                        <button id="chat-send" class="pill-btn send-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                        </button>
                    </div>
                </div>
                <div class="footer-text">Mizune AI can make mistakes. Consider verifying important information.</div>
            </div>
            
            <!-- Hidden VRM Container -->
            <div id="container" class="hidden" style="z-index: 1;"></div>
            
            <!-- Task Indicator (moved to absolute top) -->
            <div id="task-indicator" class="glass-pill hidden">
                <div class="task-dot" style="background-color: #ffcc00; box-shadow: 0 0 8px #ffcc00;"></div>
                <span id="task-text">Working...</span>
            </div>
            
            <!-- Terminal overlay hidden initially -->
            <div id="terminal-content" class="hidden"></div>
            <div id="statusEl" class="hidden"></div>
        </main>

        <!-- Right Side: Sandbox Panel (Hidden by default) -->
        <aside id="sandbox-panel" class="hidden">
            <div class="sandbox-header">
                <div class="sandbox-title">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    Mizune's Computer
                </div>
                <div class="sandbox-controls">
                    <button id="btn-close-sandbox" title="Minimize">─</button>
                </div>
            </div>
            
            <div class="sandbox-status">
                <div id="sandbox-status-dot" class="status-dot idle"></div>
                <span id="sandbox-status-text">Idle</span>
            </div>

            <div class="sandbox-terminal-wrapper">
                <div id="sandbox-terminal">
                    <div class="sandbox-idle-state">
                        <div class="sleepy-face">'-'</div>
                        <div>Waiting for tasks...</div>
                    </div>
                    <!-- Logs go here -->
                </div>
            </div>
        </aside>
    </div>

    <!-- Script -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
